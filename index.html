<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>笃实人当然要赌石 · 笃小实 × 笃小羽</title>
<meta name="description" content="笃实人当然要赌石 —— 以清华大学笃实书院吉祥物「笃小实」「笃小羽」为主角的赌石网页小游戏。看皮壳、换石头、擦窗探玉脉，在行情高点卖出，结算真实价格与盈亏。单文件、零依赖。" />
<meta name="theme-color" content="#0b110f" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<!-- Open Graph：仓库若改名，记得同步这里的绝对地址 -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://rainjin107.github.io/dushiaidushi/" />
<meta property="og:title" content="笃实人当然要赌石" />
<meta property="og:description" content="以笃实书院吉祥物笃小实 × 笃小羽为主角的赌石网页小游戏：换石、擦窗、择机卖出、结算真价。" />
<meta property="og:image" content="https://rainjin107.github.io/dushiaidushi/preview/start.png" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root{
    --bg:#0b110f;
    --panel:rgba(255,255,255,.04);
    --line:rgba(126,240,192,.13);
    --jade:#4ee8a5;
    --jade2:#a8ffd8;
    --gold:#ffd479;
    --red:#ff7b7b;
    --ink:#e9f4ee;
    --muted:#8fa79b;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
    --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(1100px 680px at 12% -12%, #16302a 0%, transparent 62%),
      radial-gradient(900px 600px at 92% -4%, #1b2b24 0%, transparent 58%),
      radial-gradient(900px 700px at 50% 118%, #0f3428 0%, transparent 62%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #app{max-width:1180px;margin:0 auto;padding:26px 20px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}

  /* ---------- 顶部 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .mark{
    width:56px;height:56px;flex:0 0 auto;border-radius:18px;
    background:linear-gradient(150deg,#1f5c46,#0e2b21);
    border:1px solid var(--line);
    display:grid;place-items:center;
    font-family:var(--serif);font-size:18px;letter-spacing:.06em;color:var(--jade2);
    box-shadow:0 10px 34px rgba(78,232,165,.16), inset 0 0 24px rgba(78,232,165,.12);
  }
  h1{
    margin:0;font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.05em;
    background:linear-gradient(100deg,#ffffff,#a8ffd8 55%,#4ee8a5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:5px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.1em}
  .stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:7px 14px;min-width:100px}
  .stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em}
  .stat strong{font-family:var(--serif);font-size:18px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .up{color:var(--jade)} .down{color:var(--red)}
  @media (max-width:560px){
    #app{padding:16px 14px 28px}
    h1{font-size:20px;letter-spacing:.03em}
    .sub{font-size:11px}
    .mark{width:44px;height:44px;border-radius:13px;font-size:14px}
    .brand{gap:10px}
    .stats{width:100%;gap:7px;margin-top:2px}
    .stat{flex:1 1 30%;min-width:0;padding:6px 10px}
    .stat span{font-size:10px}
    .stat strong{font-size:15px}
    .ghost{padding:8px 11px;font-size:12px}
    .panel{padding:14px;border-radius:18px}
    .panel-head h2{font-size:14.5px}
    .chip{font-size:10.5px;padding:3px 8px}
    .quote{font-size:32px}
    .mascot{grid-template-columns:72px 1fr;gap:9px}
    .face{width:72px;height:82px;border-radius:15px;padding:3px}
    .bubble{font-size:11.5px;padding:8px 10px}
    .actions{gap:8px}
    .primary,.sell,.swap{padding:12px 14px;font-size:13.5px;flex:1 1 auto;justify-content:center}
    .mini{border-radius:9px;font-size:9.5px}
    .mini em{font-size:8.5px}
    .sheet{padding:18px 16px 14px;border-radius:20px}
    .trueprice strong{font-size:28px}
    .big-pl{font-size:26px}
    .rows{font-size:12px}
  }
  button{font-family:var(--sans)}
  .ghost{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:9px 13px;font-size:12.5px;cursor:pointer;transition:.2s;
  }
  .ghost:hover{color:var(--jade2);border-color:rgba(126,240,192,.42);background:rgba(78,232,165,.07)}

  /* ---------- 主体 ---------- */
  .board{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,.82fr);gap:18px;align-items:start}
  @media (max-width:900px){ .board{grid-template-columns:minmax(0,1fr)} }
  .panel{
    position:relative;border:1px solid var(--line);border-radius:22px;padding:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    overflow:hidden;min-width:0;
  }
  .panel::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(520px 240px at 50% -10%, rgba(78,232,165,.10), transparent 70%);
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
  .panel-head h2{margin:0;font-family:var(--serif);font-size:16px;letter-spacing:.08em;font-weight:600;color:#d9ece3}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{
    font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    color:#cfe3da;background:rgba(255,255,255,.03);white-space:nowrap;
  }
  .chip.good{border-color:rgba(78,232,165,.45);color:#b6ffdd;background:rgba(78,232,165,.09)}
  .chip.bad{border-color:rgba(255,123,123,.34);color:#ffc6c6;background:rgba(255,123,123,.07)}

  .stage{display:grid;place-items:center;padding:4px 0 2px;position:relative;z-index:1}
  .stone-wrap{position:relative;width:100%;max-width:430px;aspect-ratio:1/1;transition:transform .25s ease}
  .stone-wrap.shake{animation:shake .42s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px) rotate(-.6deg)}
    45%{transform:translateX(6px) rotate(.5deg)}
    70%{transform:translateX(-3px)}
  }
  .boulder{display:block;width:100%;height:100%;filter:drop-shadow(0 26px 30px rgba(0,0,0,.45))}
  .grid{
    position:absolute;inset:19.5% 17% 21.5% 17%;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    gap:9px;z-index:2;
  }
  .cell{
    position:relative;border:1.6px dashed rgba(168,255,216,.34);border-radius:15px;
    background:rgba(8,18,14,.10);cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s;
    display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;
  }
  .cell:hover:not(.opened){background:rgba(78,232,165,.18);border-color:var(--jade);box-shadow:0 0 20px rgba(78,232,165,.34), inset 0 0 20px rgba(78,232,165,.16)}
  .cell:active:not(.opened){transform:scale(.96)}
  .cell .tag{font-size:11.5px;letter-spacing:.06em;color:#07231a;font-weight:600;opacity:0;transition:opacity .2s}
  .cell .plus{
    position:absolute;font-size:15px;line-height:1;color:rgba(168,255,216,.30);
    font-weight:300;transition:opacity .2s,color .2s;
  }
  .cell:hover .plus{color:rgba(168,255,216,.85)}
  .cell.opened .plus{opacity:0}
  .cell.opened{border-style:solid;border-color:rgba(168,255,216,.5);box-shadow:0 0 22px rgba(78,232,165,.4)}
  .cell.opened .tag{opacity:1}
  .cell.cutting{animation:pulse .42s ease-out}
  .cell.cutting::after{
    content:"";position:absolute;inset:-30%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,246,205,.95),rgba(255,205,120,.5) 35%,transparent 62%);
    animation:burst .42s ease-out forwards;
  }
  @keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.15);opacity:0}}
  @keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
  .cell[data-g="g5"]{background:radial-gradient(circle at 34% 28%,#eafff7,#7cf5c4 42%,#118a5d 100%)}
  .cell[data-g="g4"]{background:radial-gradient(circle at 34% 28%,#dcfff0,#4ee8a5 42%,#16734f 100%)}
  .cell[data-g="g3"]{background:radial-gradient(circle at 34% 28%,#cdf6e4,#35c98a 44%,#17654a 100%)}
  .cell[data-g="g2"]{background:radial-gradient(circle at 34% 28%,#c3dcd0,#5fa88a 46%,#2c5546 100%)}
  .cell[data-g="g1"]{background:radial-gradient(circle at 34% 28%,#cfd6d1,#7d8b84 48%,#3b4642 100%)}
  .cell[data-g="g0"]{background:radial-gradient(circle at 34% 28%,#c6ccc8,#5b6560 50%,#2b332f 100%)}

  .actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
  .primary,.sell{
    border-radius:14px;border:1px solid transparent;cursor:pointer;
    padding:13px 20px;font-size:14.5px;letter-spacing:.04em;font-weight:600;
    display:inline-flex;align-items:center;gap:10px;transition:.2s;
  }
  .primary{
    background:linear-gradient(135deg,#4ee8a5,#2bb87e);color:#04231a;
    box-shadow:0 12px 28px rgba(78,232,165,.28);
  }
  .primary:hover{transform:translateY(-1px);box-shadow:0 16px 34px rgba(78,232,165,.36)}
  .primary em,.sell em{font-style:normal;font-weight:700;font-size:14px}
  .sell{
    background:linear-gradient(135deg,#ffd479,#f0ab3c);color:#3a2506;
    box-shadow:0 12px 28px rgba(255,212,121,.22);
  }
  .sell:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 34px rgba(255,212,121,.32)}
  .primary:disabled,.sell:disabled,.swap:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
  .swap{
    background:rgba(255,255,255,.05);color:#cfe3da;
    border:1px solid rgba(168,255,216,.26);border-radius:14px;
    padding:13px 18px;font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:.2s;
  }
  .swap em{font-style:normal;font-weight:700;font-size:13.5px;color:var(--jade2)}
  .swap .left{font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.06em}
  .swap:hover:not(:disabled){background:rgba(78,232,165,.12);border-color:rgba(126,240,192,.5);transform:translateY(-1px)}
  .hidden{display:none !important}
  .hintfoot{
    margin:12px 2px 0;font-size:11.5px;line-height:1.7;color:var(--muted);
    text-align:center;letter-spacing:.02em;position:relative;z-index:1;
  }

  /* ---------- 侧栏 ---------- */
  .side{display:flex;flex-direction:column;gap:14px}
  .quote-card{
    border:1px solid var(--line);border-radius:18px;padding:15px 16px 12px;
    background:radial-gradient(420px 200px at 80% -20%, rgba(78,232,165,.13), transparent 70%), rgba(255,255,255,.025);
    position:relative;overflow:hidden;
  }
  .quote-card .label{font-size:11px;letter-spacing:.22em;color:var(--muted)}
  .quote{
    font-family:var(--serif);font-size:40px;line-height:1.15;letter-spacing:.01em;
    margin:6px 0 2px;font-variant-numeric:tabular-nums;
    color:#eafff7;text-shadow:0 0 26px rgba(78,232,165,.28);
  }
  .quote.dim{color:#5d6f66;text-shadow:none;font-size:30px}
  .quote.flash-up{animation:flashUp .6s}
  .quote.flash-down{animation:flashDown .6s}
  @keyframes flashUp{0%{color:#fff;text-shadow:0 0 40px rgba(78,232,165,.9)}100%{color:#eafff7}}
  @keyframes flashDown{0%{color:#ff9a9a;text-shadow:0 0 40px rgba(255,123,123,.8)}100%{color:#eafff7}}
  .delta{height:20px;font-size:12.5px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .trend{width:100%;height:46px;display:block;margin-top:2px}
  .meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.04em}

  .mascots{display:flex;flex-direction:column;gap:12px}
  .mascot{display:grid;grid-template-columns:94px 1fr;gap:12px;align-items:start}
  .face{
    width:94px;height:106px;border-radius:20px;padding:4px;
    background:radial-gradient(circle at 50% 28%, rgba(78,232,165,.16), rgba(255,255,255,.04) 70%);
    border:1px solid var(--line);
    display:grid;place-items:center;flex:0 0 auto;
    box-shadow:inset 0 0 18px rgba(0,0,0,.28);
  }
  .mascots .mascot:nth-child(1) .face{
    background:radial-gradient(circle at 50% 26%, rgba(120,170,255,.26), rgba(12,22,40,.30) 72%);
  }
  .mascots .mascot:nth-child(2) .face{
    background:radial-gradient(circle at 50% 26%, rgba(255,130,185,.24), rgba(44,12,26,.30) 72%);
  }
  .face img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 5px 9px rgba(0,0,0,.45))}
  .bubble{
    border:1px solid var(--line);border-radius:14px;padding:9px 12px;
    background:rgba(255,255,255,.045);font-size:12.5px;line-height:1.6;color:#d6e7de;
    min-height:44px;position:relative;
  }
  .bubble::before{
    content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;
    background:inherit;border-left:1px solid var(--line);border-bottom:1px solid var(--line);
    transform:rotate(45deg);border-radius:2px;
  }
  .bubble b{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--jade);margin-bottom:3px;font-weight:600}
  .bubble.pulse{animation:msgPop .3s ease-out}
  @keyframes msgPop{0%{transform:translateY(4px);opacity:.4}100%{transform:none;opacity:1}}

  .log{
    border:1px solid var(--line);border-radius:16px;padding:10px 12px;
    background:rgba(0,0,0,.16);max-height:168px;overflow:auto;
    font-size:11.5px;line-height:1.85;color:var(--muted);
  }
  .log p{margin:0}
  .log p.new{animation:msgPop .3s}
  .log .hl{color:var(--jade2)}
  .log .warn{color:#ffc9c9}

  /* ---------- 遮罩 / 结算 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;
    background:rgba(4,9,7,.74);backdrop-filter:blur(9px);
  }
  .overlay.show{display:grid;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{
    width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px;padding:22px 22px 18px;
    background:linear-gradient(180deg,#14241d,#0c1612);
    border:1px solid rgba(126,240,192,.26);
    box-shadow:0 36px 90px rgba(0,0,0,.66);
    animation:sheetIn .32s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes sheetIn{0%{transform:translateY(14px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
  .kicker{font-size:11px;letter-spacing:.24em;color:var(--muted)}
  .sheet h2{margin:6px 0 2px;font-family:var(--serif);font-size:22px;letter-spacing:.05em;color:#e6f8ef}
  .trueprice{
    margin:14px 0 4px;padding:14px 16px;border-radius:16px;
    background:radial-gradient(340px 140px at 20% -30%, rgba(255,212,121,.18), transparent 70%), rgba(255,255,255,.035);
    border:1px solid rgba(255,212,121,.24);
  }
  .trueprice span{display:block;font-size:11px;letter-spacing:.2em;color:#e3c98d}
  .trueprice strong{font-family:var(--serif);font-size:34px;color:var(--gold);letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .rows{display:grid;gap:6px;margin:12px 2px 10px;font-size:13px}
  .rows div{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px dashed rgba(255,255,255,.07)}
  .rows span{color:var(--muted)}
  .rows b{font-family:var(--serif);font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .verdicts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .v{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:#cfe3da;background:rgba(255,255,255,.04)}
  .v.good{border-color:rgba(78,232,165,.5);color:#b6ffdd;background:rgba(78,232,165,.1)}
  .v.bad{border-color:rgba(255,123,123,.42);color:#ffc6c6;background:rgba(255,123,123,.09)}
  .big-pl{
    display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:32px;
    letter-spacing:.01em;font-variant-numeric:tabular-nums;margin:2px 0 4px;
  }
  .big-pl em{font-style:normal;font-family:var(--sans);font-size:11.5px;letter-spacing:.16em;color:var(--muted)}
  .minigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0 10px}
  .mini{
    position:relative;border-radius:11px;border:1px solid rgba(255,255,255,.12);
    aspect-ratio:1.55/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:10.5px;color:#08251b;font-weight:600;letter-spacing:.04em;overflow:hidden;
  }
  .mini em{font-style:normal;font-weight:500;font-size:9.5px;opacity:.72}
  .mini.cut{box-shadow:0 0 0 2px var(--gold) inset}
  .mini.cut::after{
    content:"已擦";position:absolute;top:2px;right:4px;font-size:8px;color:#2b1c00;
    background:var(--gold);border-radius:4px;padding:0 3px;line-height:12px;font-weight:700;
  }
  .mini[data-g="g5"]{background:linear-gradient(150deg,#eafff7,#7cf5c4 55%,#118a5d)}
  .mini[data-g="g4"]{background:linear-gradient(150deg,#dcfff0,#4ee8a5 55%,#16734f)}
  .mini[data-g="g3"]{background:linear-gradient(150deg,#cdf6e4,#35c98a 55%,#17654a)}
  .mini[data-g="g2"]{background:linear-gradient(150deg,#c3dcd0,#5fa88a 55%,#2c5546)}
  .mini[data-g="g1"]{background:linear-gradient(150deg,#cfd6d1,#7d8b84 55%,#3b4642)}
  .mini[data-g="g0"]{background:linear-gradient(150deg,#c6ccc8,#5b6560 55%,#2b332f)}
  .sheet-note{font-size:12px;line-height:1.75;color:var(--muted);margin:8px 2px 14px}
  .sheet-actions{display:flex;gap:10px;flex-wrap:wrap}
  .sheet-actions .primary,.sheet-actions .ghost{flex:1 1 140px;justify-content:center}
  .rules p{font-size:13px;line-height:1.95;color:#cfe1d8;margin:0 0 8px}
  .rules b{color:var(--jade2);font-weight:600}
  .rules .tagline{font-size:12px;color:var(--muted);margin-top:10px}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:#5d7267;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark">赌石</div>
      <div>
        <h1>笃实人当然要赌石</h1>
        <p class="sub">笃小实 × 笃小羽 · 书院割石实录</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>资金</span><strong id="cash">¥10,000</strong></div>
      <div class="stat"><span>本局盈亏</span><strong id="pl">—</strong></div>
      <div class="stat"><span>累计盈亏</span><strong id="total">¥0</strong></div>
      <button id="btnRules" class="ghost" type="button">玩法</button>
      <button id="btnReset" class="ghost" type="button">重开</button>
    </div>
  </header>

  <main class="board">
    <section class="panel stone-panel">
      <div class="panel-head">
        <h2>第 <span id="roundNo">1</span> 块 · 原石</h2>
        <div class="chips" id="hints"></div>
      </div>

      <div class="stage">
        <div class="stone-wrap" id="stoneWrap">
          <svg class="boulder" viewBox="0 0 300 300" aria-hidden="true">
            <defs>
              <radialGradient id="stoneGrad" cx="32%" cy="22%" r="86%">
                <stop offset="0%" stop-color="#93a096"/>
                <stop offset="34%" stop-color="#5f6d62"/>

<script>
(function(){
  'use strict';

  /* =========================================================
     配置
     ========================================================= */
  var CFG = {
    startCash: 10000,
    maxCuts: 6,
    cutFee: 60,
    swapFee: 60,     // 换一块的"看石费"
    maxSwaps: 3,     // 每块石头最多换几次
    minStone: 850
  };

  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(n){
    return '¥' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  };
  var clamp = function(v, a, b){ return Math.max(a, Math.min(b, v)); };
  var rnd = function(a, b){ return a + Math.random() * (b - a); };
  var pick = function(arr){ return arr[Math.floor(Math.random() * arr.length)]; };

  var gaussSpare = null;
  function gauss(){
    if (gaussSpare !== null){ var s = gaussSpare; gaussSpare = null; return s; }
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    var r = Math.sqrt(-2 * Math.log(u));
    var t = 2 * Math.PI * v;
    gaussSpare = r * Math.sin(t);
    return r * Math.cos(t);
  }

  /* =========================================================
     品质分档
     ========================================================= */
  var GRADES = [
    { min: 85, key: 'g5', name: '玻璃种' },
    { min: 70, key: 'g4', name: '冰种' },
    { min: 55, key: 'g3', name: '糯种' },
    { min: 40, key: 'g2', name: '豆种' },
    { min: 25, key: 'g1', name: '粗豆' },
    { min: 0,  key: 'g0', name: '石性' }
  ];
  function gradeOf(score){
    for (var i = 0; i < GRADES.length; i++){
      if (score >= GRADES[i].min) return GRADES[i];
    }
    return GRADES[GRADES.length - 1];
  }

  /* =========================================================
     "料子倍数"曲线：报价与估价共用
     VAL_SCALE 经模拟校准，使 E[真实价] ≈ E[报价]（石头整体不偏贵也不偏便宜，
     玩家赚的是"卖点"，不是"捡漏"）
     ========================================================= */
  var TUNE = {
    vA: 0.10, vB: 4.6, vExp: 1.9,   // 料子价值曲线
    hintNoise: 0.50,                // 蟒带方位提示的噪声（越大越不可靠）
    hintPrem: 380,                  // 有货的皮壳，石商加价（每一条好线索）
    vstr: [0.45, 1.15],             // 玉脉浓淡
    rho: 0.18                       // 石商"以窗推石"的推演强度（越小越保守，越可能被看穿）
  };
  var VAL_SCALE = 0.882;
  function valueMult(score){
    return (TUNE.vA + TUNE.vB * Math.pow(score / 100, TUNE.vExp)) * VAL_SCALE;
  }

  /* ---------- 状态 ---------- */
  var state = {
    cash: CFG.startCash,
    round: 0,
    totalPL: 0,
    phase: 'idle',      // idle | offered | cutting | settled
    stone: null,
    cuts: 0,
    swaps: 0,
    est: 0,
    estHist: [],
    mood: 1,
    busy: false
  };

  var el = {
    cash: $('cash'), pl: $('pl'), total: $('total'),
    roundNo: $('roundNo'), hints: $('hints'),
    grid: $('cellGrid'), wrap: $('stoneWrap'),
    quote: $('quote'), delta: $('delta'), trend: $('trend'),
    cutInfo: $('cutInfo'), moodInfo: $('moodInfo'),
    btnBuy: $('btnBuy'), btnSell: $('btnSell'), btnSwap: $('btnSwap'),
    buyLabel: $('buyLabel'), priceTag: $('priceTag'), sellTag: $('sellTag'),
    sayShi: $('sayShi'), sayYu: $('sayYu'),
    log: $('log'), overlay: $('overlay'), sheet: $('sheet'),
    btnRules: $('btnRules'), btnReset: $('btnReset'),
    footHint: $('footHint')
  };
  var lastLine = {};

  /* =========================================================
     原石生成：玉脉在石面形成 3×3 的品质场
     —— 位置决定你擦到的是玉脉还是石性
     ========================================================= */
  var TIERS = [[0.50, 12, 38], [0.28, 38, 62], [0.16, 62, 82], [0.06, 82, 97]];

  function sampleT(){
    var r = Math.random(), acc = 0;
    for (var i = 0; i < TIERS.length; i++){
      acc += TIERS[i][0];
      if (r <= acc) return rnd(TIERS[i][1], TIERS[i][2]);
    }
    return 50;
  }

  /* 九格"先天蟒带强度"期望（蒙特卡洛预估）。
     扣除它之后，没有任何一格天生占便宜——只有这块石头的蟒带走向才决定好坏，
     所以"位置选择"必须靠线索判断，而不是记套路。 */
  var EPROX = (function(){
    var acc = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var S = 4000;
    for (var s = 0; s < S; s++){
      var th = Math.random() * Math.PI;
      var nx = Math.cos(th), ny = Math.sin(th);
      var off = rnd(-1.75, 1.75);
      var sigma = rnd(0.5, 1.0);
      for (var r = 0; r < 3; r++){
        for (var c = 0; c < 3; c++){
          var d = Math.abs(nx * (r - 1) + ny * (c - 1) - off);
          acc[r * 3 + c] += Math.exp(-(d * d) / (2 * sigma * sigma));
        }
      }
    }
    return acc.map(function(v){ return v / S; });
  })();

  function makeStone(){
    var T = sampleT();                        // 这块石头的底子
    var vstrength = rnd(TUNE.vstr[0], TUNE.vstr[1]);   // 玉脉浓淡
    var theta = Math.random() * Math.PI;      // 蟒带走向（随机方位，任何一格都不占便宜）
    var nx = Math.cos(theta), ny = Math.sin(theta);
    var off = rnd(-1.75, 1.75);               // 蟒带偏移
    var sigma = rnd(0.5, 1.0);                // 脉宽

    var cells = [];
    var best = { r: 0, c: 0, prox: -1 };
    for (var r = 0; r < 3; r++){
      for (var c = 0; c < 3; c++){
        var dist = Math.abs(nx * (r - 1) + ny * (c - 1) - off);   // 到蟒带的距离
        var prox = Math.exp(-(dist * dist) / (2 * sigma * sigma));
        if (prox > best.prox) best = { r: r, c: c, prox: prox };
        var score = T + (prox - EPROX[r * 3 + c]) * 1.9 * T * vstrength + gauss() * 5.5;
        cells.push({ r: r, c: c, score: clamp(score, 2, 99), opened: false, node: null });
      }
    }
    var Ttrue = cells.reduce(function(s, x){ return s + x.score; }, 0) / 9;

    /* 皮壳线索：与底子弱相关；有蟒带时给出方位提示（带噪声，不是准确答案） */
    var hints = [];
    var shellGood = Math.random() < clamp(0.16 + Ttrue / 110, 0.05, 0.92);
    hints.push(shellGood ? { kind: 'good', text: '皮壳紧实' } : { kind: 'bad', text: '皮壳松散' });

    var flowerGood = Math.random() < clamp(0.10 + Ttrue / 120, 0.04, 0.90);
    hints.push(flowerGood ? { kind: 'good', text: '表面有松花' } : { kind: 'bad', text: '未见松花' });

    var hasVein = Math.random() < clamp(0.30 + Ttrue / 160, 0.14, 0.82);
    if (hasVein){
      var hr = best.r, hc = best.c;
      if (Math.random() < TUNE.hintNoise) hr = clamp(hr + (Math.random() < 0.5 ? -1 : 1), 0, 2);
      if (Math.random() < TUNE.hintNoise) hc = clamp(hc + (Math.random() < 0.5 ? -1 : 1), 0, 2);
      hints.push({ kind: 'good', text: '见蟒带 · ' + ['上', '中', '下'][hr] + ['左', '中', '右'][hc] + '侧' });
    } else {
      hints.push({ kind: 'bad', text: '无蟒带' });
    }

    if (Math.random() < clamp(0.40 - Ttrue / 300, 0.05, 0.45)){
      hints.push({ kind: 'bad', text: '皮壳见细裂' });
    }

    /* 报价：由皮壳线索与随行就市决定，不直接等于真实价值 */
    var hintScore = hints.filter(function(h){ return h.kind === 'good'; }).length
                  - hints.filter(function(h){ return h.kind === 'bad'; }).length;
    var price = 1450 + gauss() * 330 + hintScore * TUNE.hintPrem;
    price = clamp(Math.round(price / 50) * 50, 850, 3000);

    var trueValue = Math.round(price * valueMult(Ttrue) / 10) * 10;

    return {
      cells: cells,
      T: Ttrue,
      price: price,
      trueValue: trueValue,
      hints: hints,
      band: { theta: theta, off: off, sigma: sigma }
    };
  }

  /* =========================================================
     石商报价与情绪
     —— 石商有"近因偏差"：他主要看你刚擦出来的那一窗，情绪缓慢回落。
        所以擦完一刀马上报价，往往就是这段行情的最高点；
        连擦两刀都不好，行情会一路凉下去。
     ========================================================= */
  var CONF = [0, 1.005, 1.021, 1.036, 1.047, 1.055, 1.059]; // 报价系数（随刀数微调，模拟校准）

  function moodStep(score){
    var react = 0.30 * (score - 45) / 50;             // 好窗拉高情绪，坏窗压低
    state.mood = clamp(0.55 * state.mood + 0.45 * (1 + react) + gauss() * 0.03, 0.68, 1.36);
  }

  function computeEst(){
    var opened = state.stone.cells.filter(function(c){ return c.opened; });
    if (!opened.length) return 0;
    var n = opened.length;
    var avg = opened.reduce(function(s, c){ return s + c.score; }, 0) / n;
    /* 石商估的是"整块石头"，不是"你刚擦的窗"：
       已知 n 个窗，其余 9-n 格按经验相关推演，得到对整石平均分的估计 */
    var rest = 45 + TUNE.rho * (avg - 45);
    var hat = n >= 9 ? avg : (n * avg + (9 - n) * rest) / 9;
    var conf = CONF[n] || CONF[CONF.length - 1];
    return Math.max(state.stone.price * 0.05, state.stone.price * valueMult(hat) * conf * state.mood);
  }

  function moodLabel(){
    var m = state.mood;
    if (m >= 1.13) return '行情火热 ↑↑';
    if (m >= 1.05) return '行情偏热 ↑';
    if (m >= 0.97) return '行情平稳 →';
    if (m >= 0.89) return '行情偏冷 ↓';
    return '行情冰凉 ↓↓';
  }

  /* =========================================================
     渲染
     ========================================================= */
  function renderHUD(){
    el.cash.textContent = fmt(state.cash);
    el.roundNo.textContent = state.round;
    el.total.textContent = (state.totalPL >= 0 ? '+' : '') + fmt(state.totalPL);
    el.total.className = state.totalPL > 0 ? 'up' : (state.totalPL < 0 ? 'down' : '');
    var pl = state.pl;
    if (typeof pl === 'number'){
      el.pl.textContent = (pl >= 0 ? '+' : '') + fmt(pl);
      el.pl.className = pl > 0 ? 'up' : (pl < 0 ? 'down' : '');
    } else {
      el.pl.textContent = '—';
      el.pl.className = '';
    }
  }

  function renderHints(){
    el.hints.innerHTML = state.stone.hints.map(function(h){
      return '<span class="chip ' + h.kind + '">' + h.text + '</span>';
    }).join('');
  }

  function renderCells(){
    el.grid.innerHTML = '';
    state.stone.cells.forEach(function(cell){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.innerHTML = '<span class="plus">+</span><span class="tag"></span>';
      b.addEventListener('click', function(){ onCellClick(cell); });
      el.grid.appendChild(b);
      cell.node = b;
    });
  }

  function paintCell(cell){
    var g = gradeOf(cell.score);
    cell.node.className = 'cell opened';
    cell.node.setAttribute('data-g', g.key);
    cell.node.title = g.name + ' · 评分 ' + Math.round(cell.score);
    cell.node.innerHTML = '<span class="tag">' + g.name + '</span>';
  }

  function animateNumber(node, from, to, dur){
    var t0 = performance.now();
    function step(t){
      var p = clamp((t - t0) / dur, 0, 1);
      var e = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function renderQuote(prev){
    var est = state.est;
    if (!est){
      el.quote.textContent = '待估价';
      el.quote.className = 'quote dim';
      el.delta.textContent = '';
      el.cutInfo.textContent = '已擦 ' + state.cuts + ' / ' + CFG.maxCuts + ' 刀';
      el.moodInfo.textContent = moodLabel();
      renderTrend();
      return;
    }
    el.quote.className = 'quote';
    animateNumber(el.quote, prev || 0, est, 520);
    el.quote.classList.remove('flash-up', 'flash-down');
    void el.quote.offsetWidth;
    el.quote.classList.add(est >= (prev || 0) ? 'flash-up' : 'flash-down');

    if (prev && prev > 0){
      var d = est - prev;
      el.delta.textContent = (d >= 0 ? '↑ +' : '↓ −') + fmt(Math.abs(d)) +
        '（' + (d >= 0 ? '+' : '−') + Math.abs(d / prev * 100).toFixed(0) + '%）';
      el.delta.className = 'delta ' + (d >= 0 ? 'up' : 'down');
    } else {
      el.delta.textContent = '石商开价：' + fmt(est);
      el.delta.className = 'delta';
    }
    el.cutInfo.textContent = '已擦 ' + state.cuts + ' / ' + CFG.maxCuts + ' 刀 · 刀费 ' + fmt(state.cuts * CFG.cutFee);
    el.moodInfo.textContent = moodLabel();
    renderTrend();
  }

  function renderTrend(){
    var h = state.estHist;
    var defs = '<defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#4ee8a5" stop-opacity=".38"/>' +
      '<stop offset="1" stop-color="#4ee8a5" stop-opacity="0"/></linearGradient></defs>';
    if (!h.length){ el.trend.innerHTML = defs; return; }
    if (h.length === 1){
      el.trend.innerHTML = defs + '<circle cx="100" cy="23" r="3.2" fill="#4ee8a5"/>';
      return;
    }
    var W = 200, H = 46, P = 4;
    var min = Math.min.apply(null, h), max = Math.max.apply(null, h);
    var span = (max - min) || 1;
    var pts = h.map(function(v, i){
      var x = P + (i / (h.length - 1)) * (W - 2 * P);
      var y = H - P - ((v - min) / span) * (H - 2 * P);
      return [x, y];
    });
    var line = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = line + ' L ' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - P) +
      ' L ' + pts[0][0].toFixed(1) + ' ' + (H - P) + ' Z';
    el.trend.innerHTML = defs +
      '<path d="' + area + '" fill="url(#trendFill)"/>' +
      '<path d="' + line + '" fill="none" stroke="#4ee8a5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="3" fill="#a8ffd8"/>';
  }

  function renderActions(){
    var offered = state.phase === 'offered';
    var cutting = state.phase === 'cutting';
    var price = state.stone ? state.stone.price : 0;
    var poor = offered && state.cash < price;

    el.btnBuy.classList.toggle('hidden', !offered);
    el.buyLabel.textContent = poor ? '资金不够了，收工' : '入手这块石头';
    el.priceTag.textContent = poor ? '' : fmt(price);

    /* 换一块：看石费 + 次数上限 */
    var left = CFG.maxSwaps - state.swaps;
    el.btnSwap.classList.toggle('hidden', !offered);
    el.btnSwap.disabled = !offered || left <= 0 || state.cash < CFG.swapFee;
    el.btnSwap.innerHTML = '换一块 <em>' + fmt(CFG.swapFee) + '</em>' +
      (left > 0 ? '<span class="left">剩 ' + left + ' 次</span>' : '<span class="left">已换满</span>');

    el.btnSell.disabled = !(cutting && state.cuts > 0 && !state.busy);
    if (cutting && state.cuts >= CFG.maxCuts){
      el.btnSell.innerHTML = '擦穿了，必须出手 <em>' + fmt(state.est) + '</em>';
    } else if (cutting && state.cuts > 0){
      el.btnSell.innerHTML = '卖出 <em>' + fmt(state.est) + '</em>';
    } else {
      el.btnSell.innerHTML = '卖出 <em>—</em>';
    }
    el.btnSell.classList.toggle('hidden', !cutting);
  }

  function log(text, cls){
    var p = document.createElement('p');
    if (cls) p.className = cls;
    p.innerHTML = text;
    p.classList.add('new');
    el.log.appendChild(p);
    el.log.scrollTop = el.log.scrollHeight;
    while (el.log.children.length > 40) el.log.removeChild(el.log.firstChild);
  }

  /* =========================================================
     台词

      buy: ['拿下！我这手感，百分百有绿！（大概）', '买了买了！先擦哪一格？我建议全擦！（不行）'],
      needBuy: ['先买呀！不买怎么擦！'],
      swap: ['换！这块我一看就没感觉！', '换换换！下一块必定有货！', '又换？你到底还想不想赚钱了……'],

      midCut: ['还行吧，糯种，能吃口饭。', '中规中矩。要不要再来一刀赌个惊喜？'],
      badCut: ['……咳咳。赌石嘛，裂纹是石头的胎记。', '啊这。没关系，下一刀一定是好的！', '石性！石性！我怀疑是这块石头不识货。'],
      rise: ['涨了涨了！再擦一刀？我赌它还有！', '行情起飞！这时候不贪，等什么时候贪？'],

      sell: ['卖！{sell}！落袋为安！'],
      settleHigh: ['漂亮！卖在最高点，你就是书院第一赌神！', '高位出货！这波操作我记一辈子！'],
      settleLow: ['呃……我们是不是卖早了？真价 {true} 呢。', '啊——卖飞了！我不听我不听！'],

      forced: ['擦穿了！没事，至少我们擦得很有气势。', '六刀！够本了！出手吧！']
    }
  };

  var sayTimers = { shi: 0, yu: 0 };

  function sayLater(who, key, vars, delay){
    window.clearTimeout(sayTimers[who]);
    sayTimers[who] = window.setTimeout(function(){
      if (state.phase === 'cutting') say(who, key, vars);
    }, delay);
  }

  function say(who, key, vars){
    var bank = LINES[who] && LINES[who][key];
    if (!bank) return;
    window.clearTimeout(sayTimers[who]);
    var idx = Math.floor(Math.random() * bank.length);
    if (bank.length > 1 && lastLine[who + key] === idx) idx = (idx + 1) % bank.length;
    lastLine[who + key] = idx;
    var text = bank[idx].replace(/\{(\w+)\}/g, function(m, k){
      return vars && vars[k] !== undefined ? vars[k] : m;
    });
    var node = who === 'shi' ? el.sayShi : el.sayYu;
    var name = who === 'shi' ? '笃小实 · 谨慎派' : '笃小羽 · 冲锋派';
    node.innerHTML = '<b>' + name + '</b>' + text;
    node.classList.remove('pulse');
    void node.offsetWidth;
    node.classList.add('pulse');
  }

  /* =========================================================
     流程
     ========================================================= */
  function dealStone(){
    state.stone = makeStone();
    state.cuts = 0;
    state.est = 0;
    state.estHist = [];
    state.mood = 1;
    state.phase = 'offered';
    state.busy = false;
    state.pl = undefined;

    renderHUD();
    renderHints();
    renderCells();
    renderQuote(0);
    renderActions();
  }

  function newRound(){
    state.round += 1;
    state.swaps = 0;
    dealStone();

    el.footHint.textContent = '第 ' + state.round + ' 块开价 ' + fmt(state.stone.price) +
      '。看皮壳线索，不合眼缘可以换一块（最多 ' + CFG.maxSwaps + ' 次）。';

    log('—— 第 ' + state.round + ' 块原石，报价 <span class="hl">' + fmt(state.stone.price) + '</span> ——');
    say('shi', 'offer', { price: fmt(state.stone.price) });
    say('yu', 'offer', { price: fmt(state.stone.price) });
  }

  function swapStone(){
    if (state.phase !== 'offered') return;
    if (state.swaps >= CFG.maxSwaps) return;
    if (state.cash < CFG.swapFee) return;

    state.cash -= CFG.swapFee;
    state.swaps += 1;
    state.round += 1;
    dealStone();

    var left = CFG.maxSwaps - state.swaps;
    el.footHint.textContent = '换了一块，看石费 ' + fmt(CFG.swapFee) + '。' +
      (left > 0 ? '还能再换 ' + left + ' 次。' : '这块不能再换了，要么入手，要么走人。');

    log('换了一块（第 ' + state.round + ' 块），看石费 <span class="hl">' + fmt(CFG.swapFee) +
      '</span>，资金 ' + fmt(state.cash));
    say('shi', 'swap', { fee: fmt(CFG.swapFee) });
    say('yu', 'swap');
  }

  function buy(){
    if (state.phase !== 'offered') return;
    if (state.cash < state.stone.price){ showGameOver(); return; }
    state.cash -= state.stone.price;
    state.phase = 'cutting';
    renderHUD();
    renderActions();
    el.footHint.textContent = '点石面上的格位擦窗（最多 ' + CFG.maxCuts + ' 刀，' + fmt(CFG.cutFee) + '/刀）。价格合适随时可以卖。';
    log('入手成功，支出 <span class="hl">' + fmt(state.stone.price) + '</span>，资金 ' + fmt(state.cash));
    say('shi', 'buy', { price: fmt(state.stone.price) });
    say('yu', 'buy');
  }

  function onCellClick(cell){
    if (state.phase === 'offered'){ say('yu', 'needBuy'); return; }
    if (state.phase !== 'cutting') return;
    if (state.busy || cell.opened) return;
    if (state.cuts >= CFG.maxCuts) return;
    cut(cell);
  }

  function cut(cell){
    state.busy = true;
    var prev = state.est;

    state.cash -= CFG.cutFee;
    cell.opened = true;
    state.cuts += 1;
    moodStep(cell.score);
    state.est = computeEst();
    state.estHist.push(state.est);

    renderHUD();
    renderActions();
    cell.node.classList.add('cutting');
    el.wrap.classList.remove('shake');
    void el.wrap.offsetWidth;
    el.wrap.classList.add('shake');

    window.setTimeout(function(){
      cell.node.classList.remove('cutting');
      paintCell(cell);
      renderQuote(prev);
      renderActions();

      var g = gradeOf(cell.score);
      var others = state.stone.cells.filter(function(c){ return c.opened && c !== cell; });
      var prevAvg = others.length
        ? others.reduce(function(s, c){ return s + c.score; }, 0) / others.length
        : null;
      var diff = state.est - prev;

      if (g.min >= 70){
        say('shi', 'goodCut'); say('yu', 'goodCut');
        log('擦出 <span class="hl">' + g.name + '</span>（评分 ' + Math.round(cell.score) + '），估价 → ' + fmt(state.est));
      } else if (g.min >= 40){
        say('shi', 'midCut'); say('yu', 'midCut');
        log('擦出 ' + g.name + '（评分 ' + Math.round(cell.score) + '），估价 → ' + fmt(state.est));
      } else {
        say('shi', 'badCut'); say('yu', 'badCut');
        log('擦出 <span class="warn">' + g.name + '</span>（评分 ' + Math.round(cell.score) + '），估价 → ' + fmt(state.est), 'warn');
      }

      if (typeof prevAvg === 'number' && Math.abs(diff) > state.stone.price * 0.04){
        sayLater('shi', diff > 0 ? 'rise' : 'drop', null, 2100);
      }
      if (Math.abs(diff) > state.stone.price * 0.06){
        sayLater('yu', diff > 0 ? 'rise' : 'drop', null, 2700);
      }

      state.busy = false;
      renderActions();

      if (state.cuts >= CFG.maxCuts){
        say('shi', 'forced'); say('yu', 'forced');
        window.setTimeout(function(){
          if (state.phase === 'cutting') sell(true);
        }, 1100);
      }
    }, 440);
  }

  function sell(forced){
    if (state.phase !== 'cutting' || state.cuts === 0) return;
    if (state.busy) return;

    var st = state.stone;
    var sellPrice = Math.round(state.est / 10) * 10;
    var fees = state.cuts * CFG.cutFee;

    state.cash += sellPrice;
    var pl = sellPrice - st.price - fees;
    state.totalPL += pl;
    state.pl = pl;
    state.phase = 'settled';

    renderHUD();
    renderActions();
    say('shi', 'sell', { sell: fmt(sellPrice) });
    say('yu', 'sell', { sell: fmt(sellPrice) });
    log('卖出，收入 <span class="hl">' + fmt(sellPrice) + '</span>；本局盈亏 ' + (pl >= 0 ? '+' : '') + fmt(pl));

    showSettle(st, sellPrice, fees, pl, forced);
  }

  /* =========================================================
     结算面板
     ========================================================= */
  function miniGridHTML(st){
    return st.cells.map(function(c){
      var g = gradeOf(c.score);
      return '<div class="mini' + (c.opened ? ' cut' : '') + '" data-g="' + g.key + '">' +
        '<span>' + g.name + '</span><em>' + Math.round(c.score) + '</em></div>';
    }).join('');
  }

  function showSettle(st, sellPrice, fees, pl, forced){
    var diff = st.trueValue - sellPrice;
    var ratio = sellPrice / (st.trueValue || 1);

    var ship, shipCls, note;
    if (ratio >= 1.15){
      ship = '高位出货'; shipCls = 'good';
      note = '你把行情卖在了石头上：卖价比真价高 ' + fmt(diff) + '。' +
        (pl < 0 ? '只是当初入手价太高，这一局还是亏的。' : '');
    } else if (ratio <= 0.85){
      ship = '卖飞了'; shipCls = 'bad';
      note = '真价比你的卖价还高 ' + fmt(-diff) + '——料子其实比行情认可得更好。' +
        (pl < 0 ? '这一局仍然是亏的。' : '');
    } else {
      ship = '卖在真价附近'; shipCls = '';
      note = '卖价与真价基本一致：你卖的是石头，不是行情。';
    }

    var stoneRatio = st.trueValue / st.price;
    var stoneV, stoneCls;
    if (stoneRatio >= 3){ stoneV = '料子：大涨'; stoneCls = 'good'; }
    else if (stoneRatio >= 1.4){ stoneV = '料子：小涨'; stoneCls = 'good'; }
    else if (stoneRatio >= 0.85){ stoneV = '料子：保本'; stoneCls = ''; }
    else if (stoneRatio >= 0.5){ stoneV = '料子：半垮'; stoneCls = 'bad'; }
    else { stoneV = '料子：垮了'; stoneCls = 'bad'; }

    var broke = state.cash < CFG.minStone;

    el.sheet.innerHTML =
      '<span class="kicker">第 ' + state.round + ' 块 · 结算</span>' +
      '<h2>' + (forced ? '擦穿了，只能出手' : '你选择了卖出') + '</h2>' +
      '<div class="trueprice"><span>真实价格</span><strong>' + fmt(st.trueValue) + '</strong></div>' +
      '<div class="rows">' +
        '<div><span>入手价</span><b>' + fmt(st.price) + '</b></div>' +
        '<div><span>擦窗工费</span><b>' + fmt(fees) + '（' + state.cuts + ' 刀）</b></div>' +
        '<div><span>卖出价</span><b>' + fmt(sellPrice) + '</b></div>' +
      '</div>' +
      '<div class="verdicts"><span class="v ' + shipCls + '">' + ship + '</span>' +
        '<span class="v ' + stoneCls + '">' + stoneV + '</span></div>' +
      '<div class="big-pl ' + (pl >= 0 ? 'up' : 'down') + '" style="color:' + (pl >= 0 ? 'var(--jade)' : 'var(--red)') + '">' +
        (pl >= 0 ? '+' : '') + fmt(pl) + '<em>本局盈亏</em></div>' +
      '<div class="minigrid">' + miniGridHTML(st) + '</div>' +
      '<p class="sheet-note">' + note + '<br>资金 ' + fmt(state.cash) + ' · 累计盈亏 ' +
        (state.totalPL >= 0 ? '+' : '') + fmt(state.totalPL) + '</p>' +
      (broke ? '<p class="sheet-note" style="color:#ffc6c6">资金不足 ' + fmt(CFG.minStone) + '，这一轮收工了。</p>' : '') +
      '<div class="sheet-actions">' +
        '<button type="button" class="primary" id="btnNext">' + (broke ? '重新开始' : '下一块') + '</button>' +
        '<button type="button" class="ghost" id="btnAgain">重开一局</button>' +
      '</div>';

    el.overlay.classList.add('show');
    state.sheetMode = 'settle';

    $('btnNext').addEventListener('click', function(){
      closeSheet();
      if (broke) restart(); else newRound();
    });
    $('btnAgain').addEventListener('click', function(){
      closeSheet();
      restart();
    });

    if (ratio >= 1.15) say('shi', 'settleHigh');
    else if (ratio <= 0.85) say('shi', 'settleLow', { gap: fmt(-diff) });
    else say('shi', 'settleEven');

    if (ratio >= 1.15) say('yu', 'settleHigh');
    else if (ratio <= 0.85) say('yu', 'settleLow', { true: fmt(st.trueValue) });
    else say('yu', 'settleEven');
  }

  function closeSheet(){ el.overlay.classList.remove('show'); }

  /* 资金不足以收下眼前这块石头时的收工结算 */
  function showGameOver(){
    state.sheetMode = 'over';
    el.sheet.innerHTML =
      '<span class="kicker">收工</span>' +
      '<h2>资金不够收下这块了</h2>' +
      '<div class="trueprice"><span>最终资金</span><strong>' + fmt(state.cash) + '</strong></div>' +
      '<div class="rows">' +
        '<div><span>累计盈亏</span><b style="color:' + (state.totalPL >= 0 ? 'var(--jade)' : 'var(--red)') + '">' +
          (state.totalPL >= 0 ? '+' : '') + fmt(state.totalPL) + '</b></div>' +
      '</div>' +
      '<p class="sheet-note">看石费、刀费、行情，都是要付的学费。' +
        (state.totalPL >= 0 ? '至少这一轮，你从石商手里拿走了钱。' : '赌石这行，活着比赢重要。') + '</p>' +
      '<div class="sheet-actions"><button type="button" class="primary" id="btnAgain3">重新开始</button></div>';
    el.overlay.classList.add('show');
    $('btnAgain3').addEventListener('click', function(){ closeSheet(); restart(); });
  }

  function restart(){
    state.cash = CFG.startCash;
    state.round = 0;
    state.swaps = 0;
    state.totalPL = 0;
    state.pl = undefined;
    state.phase = 'idle';
    state.busy = false;
    el.log.innerHTML = '<p>赌石有风险，出手需谨慎。</p>';
    closeSheet();
    newRound();
  }

  /* =========================================================
     玩法说明
     ========================================================= */
  function showRules(){
    el.sheet.innerHTML =
      '<span class="kicker">玩法</span>' +
      '<h2>笃实人当然要赌石</h2>' +
      '<div class="rules">' +
        '<p><b>1. 入手原石。</b>每局一块石头，报价 ' + fmt(850) + '–' + fmt(3000) +
          '，价格由皮壳表现和行情决定，<b>不等于真实价值</b>。' +
          '不合眼缘可以<b>换一块</b>：每次 ' + fmt(CFG.swapFee) + '，每块最多换 <b>' + CFG.maxSwaps + ' 次</b>' +
          '（换来换去，石商也会把好料子的价往上抬）。</p>' +
        '<p><b>2. 擦窗看货。</b>石面有 9 个格位，最多擦 <b>' + CFG.maxCuts + ' 刀</b>，每刀 <b>' +
          fmt(CFG.cutFee) + '</b>。玉脉是一条<b>斜穿石面的蟒带</b>，擦在不同位置，看到的料子完全不同——' +
          '“见蟒带”的线索会给出方位，但只有一半左右的准头。</p>' +
        '<p><b>3. 石商如何报价。</b>他不是按你擦出来的那一窗给钱，而是<b>以窗推石</b>：' +
          '按已知的窗口去推整块石头的成色。所以他给你的报价会随窗口的成色、位置、刀数起伏，' +
          '还带着一点“近因情绪”——<b>刚擦出好窗，报价容易虚高；刚擦出废窗，报价会一路凉下去</b>。</p>' +
        '<p><b>4. 择机卖出。</b>任何时刻都能卖，<b>卖价就是当前报价</b>。擦满 ' + CFG.maxCuts +
          ' 刀石头被擦穿，<b>必须出手</b>。报价的高点往往出现在“刚擦出好窗”的那一刻。</p>' +
        '<p><b>5. 结算真价。</b>卖出后公布这块石头<b>切开后的真实价值</b>，结算：' +
          '<b>卖出价 − 入手价 − 刀费 = 本局盈亏</b>。卖得比真价高叫 <b>高位出货</b>，' +
          '卖得比真价低叫 <b>卖飞了</b>。</p>' +
        '<p><b>6. 目标。</b>本金 ' + fmt(CFG.startCash) + '，资金低于 ' + fmt(CFG.minStone) +
          ' 时收工。你能靠"看线索 + 择时"跑赢行情吗？</p>' +
        '<p class="tagline">提示：一个漂亮的窗不等于整块好料；一次涨停的估价也不等于真价。' +
          '笃小实负责算账，笃小羽负责上头——听谁的，你决定。</p>' +
      '</div>' +
      '<div class="sheet-actions"><button type="button" class="primary" id="btnRulesClose">开始赌石</button></div>';

    el.overlay.classList.add('show');
    state.sheetMode = 'rules';
    $('btnRulesClose').addEventListener('click', closeSheet);
  }

  /* =========================================================
     事件绑定与启动
     ========================================================= */
  el.btnBuy.addEventListener('click', buy);
  el.btnSwap.addEventListener('click', swapStone);
  el.btnSell.addEventListener('click', function(){ sell(false); });
  el.btnRules.addEventListener('click', showRules);
  el.btnReset.addEventListener('click', function(){
    if (window.confirm('重开一局？当前资金和累计盈亏会清零。')) restart();
  });
  el.overlay.addEventListener('click', function(e){
    if (e.target === el.overlay && state.sheetMode === 'rules') closeSheet();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && el.overlay.classList.contains('show') && state.sheetMode === 'rules'){
      closeSheet();
    }
  });

  restart();
})();
</script>
</body>
</html>
